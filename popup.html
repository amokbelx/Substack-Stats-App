<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    width: 280px;
    padding: 16px;
    color: #1B2321;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    background: #2F4A47;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #24413e; }
  button:disabled { background: #999; cursor: default; }
  #status {
    margin-top: 12px;
    font-size: 12px;
    color: #4B564F;
    line-height: 1.4;
  }
  #status.error { color: #b3402f; }
  #status.success { color: #2F4A47; }
</style>
</head>
<body>
  <h1>Substack Cookie Copier</h1>
  <button id="copyBtn">Copy cookie to clipboard</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
